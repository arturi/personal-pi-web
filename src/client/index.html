<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dispatch</title>
    <meta name="theme-color" content="#0b0d0e" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
        --pi-control-font-size: 16px;
        --pi-font-family: "Departure Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --pi-content-font-family: "Commit Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --pi-chrome-font-family: var(--pi-font-family);
        --pi-control-font-family: var(--pi-font-family);
        --pi-control-monospace-font-family: var(--pi-font-family);
        --pi-bg: #0b0d0e;
        --pi-surface: #151719;
        --pi-surface-hover: #202326;
        --pi-terminal-bg: #070808;
        --pi-terminal-text: #eee8df;
        --pi-border: #3a342f;
        --pi-border-muted: #27231f;
        --pi-text: #e7e1d8;
        --pi-text-secondary: #c9c0b5;
        --pi-text-bright: #fff8ed;
        --pi-muted: #968b80;
        --pi-dim: #746a61;
        --pi-accent: #e07032;
        --pi-accent-border: #a84b20;
        --pi-info: #58a6d8;
        --pi-selection-bg: #352116;
        --pi-success: #3fb950;
        --pi-success-border: #238636;
        --pi-success-bg: #0f1b12;
        --pi-success-surface: #0f2a16;
        --pi-success-ring: #3fb95055;
        --pi-warning: #d29922;
        --pi-warning-border: #6e5200;
        --pi-warning-surface: #1f1a10;
        --pi-danger: #ff7b72;
        --pi-purple: #d2a8ff;
        --pi-purple-border: #a371f7;
        --pi-purple-surface: #21132f;
        --pi-overlay: #0008;
        --pi-shadow-soft: #0006;
        --pi-shadow: #0008;
        --pi-shadow-strong: #000b;
        --pi-bg-overlay-soft: #0b0d0edd;
        --pi-bg-overlay: #0b0d0ee6;
        --pi-success-bg-overlay: #0f1b12ee;
        --pi-terminal-selection: #264f78;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: 100dvh; }
    </style>
  </head>
  <body>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/main.ts"></script>
